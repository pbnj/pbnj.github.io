<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title$ · Peter Benjamin</title>
  <meta name="description" content="$if(description)$$description$$else$$title$$endif$">
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="alternate" type="application/rss+xml" title="Peter Benjamin" href="/feed.xml">
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <a class="site-title" href="/">pbnj</a>
      <nav>
        <a href="/">home</a>
        <a href="/blog/" aria-current="page">blog</a>
        <a href="/resume.html">resume</a>
      </nav>
    </header>

    <main>
      <!-- Generated from posts/$slug$.md by scripts/build-posts. Edit the Markdown, not this file. -->
      <article class="md">
        <h1>$title$</h1>
        <p class="meta"><time datetime="$date$">$date$</time></p>
$if(toc)$
        <nav class="toc">
$table-of-contents$
        </nav>
$endif$
$body$
      </article>

      <hr>
      <p><a href="/blog/">← all posts</a></p>
    </main>

    <footer>© 2026 Peter Benjamin · <a href="/feed.xml">rss</a></footer>
  </div>
</body>
</html>
